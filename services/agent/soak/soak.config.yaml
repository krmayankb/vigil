# The soak's deployment: the eval's tools, answered by soak/stub.ts, and a model
# the stub plays. Priced as Gemini 2.5 Pro, so a run's dollars read like a real one.
model: soak-model
provider: soak

budgets:
  max_calls: 40
  max_wall_ms: 900000
  max_cost_usd: 3.00

runtime:
  max_turns: 16
  result_cap: 8000
  recall_limit: 3

tools:
  - id: case_records
    kind: remote
    provides: case_records
    description: Read the case records held for an investigation.
    parameters:
      type: object
      properties:
        case_id: { type: string, description: The case whose records to read. }
      required: [case_id]
    max_rows: 100
    timeout_ms: 15000
  - id: get_finding
    kind: remote
    provides: get_finding
    description: Get detailed information about a specific finding by ID.
    parameters:
      type: object
      properties:
        finding_id: { type: string, description: "The finding ID, e.g. f-1001" }
      required: [finding_id]
  - id: splunk_search
    kind: remote
    provides: telemetry_search
    description: Search the raw telemetry. Write the query in SQL over a table named events with columns time, host, user, source, event, detail.
    parameters:
      type: object
      properties:
        sql: { type: string }
      required: [sql]
  - id: search_findings
    kind: remote
    provides: findings_search
    description: Search the findings detection has already scored, by entity or keyword.
    parameters:
      type: object
      properties:
        query: { type: string }
  - id: lookup_indicators
    kind: remote
    provides: indicator_lookup
    description: Look observables (IPs, domains, hashes) up in the threat-intelligence database.
    parameters:
      type: object
      required: [values]
      properties:
        values: { type: array, items: { type: string } }

# No gates: a soak run must not park waiting for a person.
approvals: []

thresholds:
  min_corroborating_sources: 2
