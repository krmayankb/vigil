<!doctype html>
<html lang="en" class="vg-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigil · Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;650;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg0); color: var(--tx0); font: 13px/1.45 var(--font-ui); }
  .mono { font-family: var(--font-mono); }
  header { height: var(--size-header-row); display: flex; align-items: center; gap: 14px; padding: 0 24px; background: var(--bg1); border-bottom: 1px solid var(--ln0); position: sticky; top: 0; z-index: 30; }
  header .logo { font-weight: 700; letter-spacing: .02em; }
  header .logo b { color: var(--dt-red); }
  header h1 { font-size: 15px; font-weight: 650; margin: 0; }
  .chip { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: var(--radius-round); font-size: 11px; font-weight: 700; border: 1px solid var(--ln1); color: var(--tx2); }
  header .spacer { flex: 1; }
  header .meta { color: var(--tx2); font-size: 12px; }
  button { height: var(--size-button-sm); padding: 0 12px; border-radius: var(--radius-button); border: 1px solid var(--ln2); background: var(--bg2); color: var(--tx1); font: 600 12px var(--font-ui); cursor: pointer; }
  button:hover { background: var(--bg3); }
  main { padding: 20px 24px 48px; display: grid; gap: 16px; max-width: 1600px; margin: 0 auto; }
  .banner { padding: 10px 14px; border-radius: var(--radius-card-inner); border: 1px solid var(--poor-ln); background: var(--poor-bg); color: var(--tx0); }
  .banner b { color: var(--poor); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .card { background: var(--bg1); border: 1px solid var(--ln0); border-radius: var(--radius-card); padding: 16px 18px; min-width: 0; animation: vg-fade .2s; }
  .card h2 { font-size: 13px; font-weight: 650; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .label { color: var(--tx2); font-size: 12px; }
  .big { font: 500 26px/1.1 var(--font-mono); }
  .big small { font-size: 13px; color: var(--tx2); }
  .split { display: flex; gap: 18px; flex-wrap: wrap; }
  .split > div { display: grid; gap: 2px; }
  .pill { white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 6px; height: var(--size-state-pill); padding: 0 10px; border-radius: var(--radius-round); font-size: 11px; font-weight: 700; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .good { color: var(--good); background: var(--good-bg); } .fair { color: var(--fair); background: var(--fair-bg); } .poor { color: var(--poor); background: var(--poor-bg); } .none { color: var(--tx2); background: var(--bg2); }
  .bar { height: 6px; border-radius: 3px; background: var(--bg4); overflow: hidden; margin: 8px 0 4px; }
  .bar span { display: block; height: 100%; }
  .bar .good { background: var(--good); } .bar .fair { background: var(--fair); } .bar .poor { background: var(--poor); }
  .tables { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1100px) { .tables { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: separate; border-spacing: 0; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--tx2); padding: 0 10px 8px; white-space: nowrap; }
  td { padding: 9px 10px; background: var(--bg2); border-top: 1px solid var(--ln0); vertical-align: top; }
  tr:first-child td { border-top: 0; }
  tbody tr:first-child td:first-child { border-top-left-radius: var(--radius-card-inner); } tbody tr:first-child td:last-child { border-top-right-radius: var(--radius-card-inner); }
  tbody tr:last-child td:first-child { border-bottom-left-radius: var(--radius-card-inner); } tbody tr:last-child td:last-child { border-bottom-right-radius: var(--radius-card-inner); }
  tbody tr:hover td { background: var(--bg3); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.num { font-family: var(--font-mono); }
  td.id { font-family: var(--font-mono); white-space: nowrap; color: var(--tx1); }
  .prose { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { color: var(--tx2); padding: 12px 2px; }
  .count { font: 500 11px var(--font-mono); color: var(--tx2); }
</style>
</head>
<body>
<header>
  <span class="logo"><b>▲</b> Vigil</span>
  <h1>Fleet</h1>
  <span class="chip" title="A stand-in until the console has a fleet page">Temporary view</span>
  <span class="spacer"></span>
  <span class="meta" id="updated">Loading…</span>
  <button id="pause" type="button">Pause</button>
  <button id="theme" type="button">Light</button>
</header>
<main>
  <div id="banners"></div>
  <section class="tiles" id="tiles"></section>
  <section class="card">
    <h2>Lanes <span class="count" id="lanes-count"></span></h2>
    <div id="lanes"></div>
  </section>
  <section class="tables">
    <div class="card"><h2>Failed for good <span class="count" id="dead-count"></span></h2><div id="dead"></div></div>
    <div class="card"><h2>Stalled <span class="count" id="stalled-count"></span></h2><div id="stalled"></div></div>
  </section>
</main>
<script>
const REFRESH_MS = 5000;
let paused = false;
const $ = (id) => document.getElementById(id);
const esc = (text) => String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const money = (n) => (n == null ? "—" : `$${Number(n).toFixed(2)}`);
const clock = (iso) => (iso ? new Date(iso).toISOString().slice(11, 16) : "—");
const duration = (s) => {
  if (s == null) return "—";
  if (s < 60) return `${s} s`;
  if (s < 3600) return `${Math.floor(s / 60)} min ${s % 60} s`;
  return `${Math.floor(s / 3600)} h ${Math.floor((s % 3600) / 60)} min`;
};
const down = (part) => part && typeof part === "object" && "unavailable" in part;
// Usage against a limit, as the console grades it: Good < 75%, Fair 75–90%, Poor > 90%.
const usage = (used, cap) => (cap ? (used / cap < 0.75 ? "good" : used / cap <= 0.9 ? "fair" : "poor") : "none");
const pill = (level, text) => `<span class="pill ${level}">${esc(text)}</span>`;
const sum = (obj) => Object.values(obj || {}).reduce((a, b) => a + (Number(b) || 0), 0);

function tiles(s) {
  const out = [];
  const leases = down(s.leases) ? null : s.leases.by_state || {};
  const state = (name) => (leases ? sum(leases[name]) : null);
  const stalled = state("stalled");
  out.push(`<div class="card"><h2>Runs ${leases ? pill(stalled ? "poor" : "good", stalled ? `${stalled} stalled` : "None stalled") : ""}</h2>
    <div class="split">
      <div><span class="big">${state("running") ?? "—"}</span><span class="label">Running</span></div>
      <div><span class="big">${state("waiting") ?? "—"}</span><span class="label">Waiting on a person or a park</span></div>
      <div><span class="big">${state("due") ?? "—"}</span><span class="label">Due to resume</span></div>
    </div></div>`);

  const q = down(s.queues) ? null : s.queues;
  const queued = (lane) => (q && q[lane] ? (q[lane].waiting || 0) + (q[lane].prioritized || 0) : null);
  out.push(`<div class="card"><h2>Waiting to start</h2>
    <div class="split">
      <div><span class="big">${queued("human") ?? "—"}</span><span class="label">Asked by a person</span></div>
      <div><span class="big">${queued("automated") ?? "—"}</span><span class="label">Automated</span></div>
    </div></div>`);

  const oldest = down(s.oldest_waiting_s) ? null : s.oldest_waiting_s || {};
  const human = oldest ? oldest.human : null;
  const level = human == null ? "good" : human < 60 ? "good" : human <= 300 ? "fair" : "poor";
  out.push(`<div class="card"><h2>Oldest ask from a person ${oldest ? pill(level, human == null ? "None waiting" : level === "good" ? "Good" : level === "fair" ? "Fair" : "Poor") : ""}</h2>
    <span class="big">${oldest ? (human == null ? "—" : duration(human)) : "—"}</span>
    <div class="label">Oldest automated run waiting: ${oldest ? duration(oldest.automated) : "—"}</div></div>`);

  const b = s.budget;
  if (b == null) {
    out.push(`<div class="card"><h2>Spend</h2><div class="label">The fleet budget is not read by this agent-serve.</div></div>`);
  } else if (!down(b)) {
    const caps = b.caps || {};
    const row = (label, used, cap) => {
      const lvl = usage(used, cap);
      const pct = cap ? Math.min(100, (used / cap) * 100) : 0;
      return `<div style="margin-bottom:8px"><div class="label">${label}: <span class="mono">${money(used)}</span>${cap ? ` of <span class="mono">${money(cap)}</span> ${pill(lvl, `${Math.round((used / cap) * 100)}%`)}` : " · no cap set"}</div>
        ${cap ? `<div class="bar"><span class="${lvl}" style="width:${pct}%"></span></div>` : ""}</div>`;
    };
    out.push(`<div class="card"><h2>Spend</h2>${row("This hour", b.spent_this_hour_usd, caps.hourly_usd)}${row("Today", b.spent_today_usd, caps.daily_usd)}
      <div class="label">Reserved by runs in flight: <span class="mono">${money(b.reserved_usd)}</span> across <span class="mono">${b.reserved_runs}</span> runs</div></div>`);
    const lvl = usage(b.model_calls_in_flight, b.model_call_cap);
    out.push(`<div class="card"><h2>Model calls in flight ${b.model_call_cap ? pill(lvl, `${Math.round((b.model_calls_in_flight / b.model_call_cap) * 100)}%`) : ""}</h2>
      <span class="big">${b.model_calls_in_flight}${b.model_call_cap ? ` <small>of ${b.model_call_cap}</small>` : ""}</span>
      ${b.model_call_cap ? `<div class="bar"><span class="${lvl}" style="width:${Math.min(100, (b.model_calls_in_flight / b.model_call_cap) * 100)}%"></span></div>` : `<div class="label">No fleet cap set</div>`}</div>`);
  }
  $("tiles").innerHTML = out.join("");
}

function lanes(s) {
  if (down(s.queues)) return void ($("lanes").innerHTML = `<div class="empty">The run queues could not be read: ${esc(s.queues.unavailable)}</div>`);
  const oldest = down(s.oldest_waiting_s) ? {} : s.oldest_waiting_s || {};
  const names = Object.keys(s.queues || {}).sort((a, b) => (a === "human" ? -1 : b === "human" ? 1 : a.localeCompare(b)));
  $("lanes-count").textContent = names.length;
  const cols = ["waiting", "prioritized", "active", "delayed", "failed", "completed"];
  $("lanes").innerHTML = `<table><thead><tr><th>Lane</th>${cols.map((c) => `<th class="num">${c[0].toUpperCase() + c.slice(1)}</th>`).join("")}<th class="num">Oldest waiting</th></tr></thead><tbody>
    ${names.map((lane) => `<tr><td>${lane === "human" ? "Asked by a person" : "Automated"}</td>${cols.map((c) => `<td class="num">${s.queues[lane][c] ?? 0}</td>`).join("")}<td class="num">${duration(oldest[lane])}</td></tr>`).join("")}
  </tbody></table>`;
}

function dead(s) {
  if (down(s.dead_letters)) return void ($("dead").innerHTML = `<div class="empty">Could not be read: ${esc(s.dead_letters.unavailable)}</div>`);
  const rows = s.dead_letters || [];
  $("dead-count").textContent = rows.length;
  $("dead").innerHTML = rows.length === 0 ? `<div class="empty">No run has failed for good.</div>` : `<table><thead><tr><th>When</th><th>Run</th><th>Kind</th><th>Lane</th><th>Why</th></tr></thead><tbody>
    ${rows.map((r) => `<tr><td class="num">${clock(r.failed_at)}</td><td class="id" title="${esc(r.run_id)}">${esc(r.run_id.slice(0, 8))}</td><td>${esc(r.run_kind)}</td><td>${r.lane === "human" ? "Person" : "Automated"}</td><td><div class="prose" title="${esc(r.reason)}">${esc(r.reason)}</div></td></tr>`).join("")}
  </tbody></table>`;
}

function stalled(s) {
  if (down(s.leases)) return void ($("stalled").innerHTML = `<div class="empty">Could not be read: ${esc(s.leases.unavailable)}</div>`);
  const rows = s.leases.stalled || [];
  $("stalled-count").textContent = rows.length;
  $("stalled").innerHTML = rows.length === 0 ? `<div class="empty">Every run is picked up or waiting for a reason.</div>` : `<table><thead><tr><th>Run</th><th>Kind</th><th>Lane</th><th class="num">Claim lapsed</th></tr></thead><tbody>
    ${rows.map((r) => `<tr><td class="id" title="${esc(r.run_id)}">${esc(r.run_id.slice(0, 8))}</td><td>${esc(r.run_kind)}</td><td>${r.lane === "human" ? "Person" : "Automated"}</td><td class="num">${duration(Math.round((Date.now() - Date.parse(r.claim_until)) / 1000))} ago</td></tr>`).join("")}
  </tbody></table>`;
}

async function refresh() {
  if (paused) return;
  try {
    const response = await fetch("/api/fleet");
    const s = await response.json();
    if (!response.ok) throw new Error(s.error || s.message || `agent-serve answered ${response.status}`);
    const parts = ["queues", "dead_letters", "leases", "budget", "oldest_waiting_s"].filter((p) => down(s[p]));
    $("banners").innerHTML = parts.map((p) => `<div class="banner"><b>Not read:</b> ${esc(p.replace(/_/g, " "))} — ${esc(s[p].unavailable)}</div>`).join("");
    tiles(s); lanes(s); dead(s); stalled(s);
    $("updated").textContent = `Updated ${clock(s.at)} UTC · every ${REFRESH_MS / 1000} s`;
  } catch (error) {
    $("banners").innerHTML = `<div class="banner"><b>No answer from the fleet:</b> ${esc(error.message)}</div>`;
    $("updated").textContent = `Last try ${new Date().toISOString().slice(11, 16)} UTC`;
  }
}

$("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "Resume" : "Pause"; if (!paused) refresh(); };
$("theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.classList.contains("vg-dark");
  root.classList.toggle("vg-dark", !dark); root.classList.toggle("vg-light", dark);
  $("theme").textContent = dark ? "Dark" : "Light";
};
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
